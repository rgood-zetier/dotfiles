set-window-option -g mode-keys vi

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

set -g default-terminal "tmux-256color"

# ===== True color passthrough (critical for nvim) =====
set -ag terminal-overrides ",xterm-kitty:RGB"

# ===== Faster nvim feel =====
set -sg escape-time 10

# ===== Quality of life =====
set -g mouse on
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# ===== Clipboard =====
# Allow apps inside tmux (nvim) to set the outer terminal's clipboard via OSC52.
# Without this, tmux silently swallows OSC52, and nvim falls back to a path
# that makes kitty prompt for permission.
set -g set-clipboard on
set -ag terminal-overrides ",xterm-kitty:Ms=\\E]52;%p1%s;%p2%s\\7"

bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "xclip -in -selection clipboard"
bind -T copy-mode-vi DoubleClick1Pane select-pane \; send-keys -X select-word \; send-keys -X copy-pipe-and-cancel "xclip -in -selection clipboard"
bind -T root DoubleClick1Pane select-pane -t= \; if -F "#{mouse_any_flag}" "send-keys -M" "copy-mode -e; send-keys -X select-word; send-keys -X copy-pipe-and-cancel 'xclip -in -selection clipboard'"

# ===== Easy config reload =====
bind r source-file ~/.tmux.conf \; display "tmux.conf reloaded"
