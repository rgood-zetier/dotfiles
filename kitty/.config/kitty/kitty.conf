# Font
font_family      FiraCode Nerd Font Mono
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        12.0

disable_ligatures cursor

# Cursor
cursor_shape          beam
cursor_blink_interval 0.5

# Scrollback
scrollback_lines 10000

# Window
window_padding_width 6
hide_window_decorations no
confirm_os_window_close 0

# Performance
repaint_delay   10
input_delay     3
sync_to_monitor yes

# Auto-launch tmux on open (delete this block if you'd rather start it manually)
shell tmux new-session -A -s main

# TokyoNight theme to match your nvim
foreground            #c0caf5
background            #1a1b26
selection_foreground  #1a1b26
selection_background  #c0caf5
color0  #15161e
color1  #f7768e
color2  #9ece6a
color3  #e0af68
color4  #7aa2f7
color5  #bb9af7
color6  #7dcfff
color7  #a9b1d6
color8  #414868
color9  #f7768e
color10 #9ece6a
color11 #e0af68
color12 #7aa2f7
color13 #bb9af7
color14 #7dcfff
color15 #c0caf5
